name: Deploy Cert-Vault

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Node.js
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: powershell
        run: |
          npm install

      - name: Restart Cert-Vault
        shell: powershell
        run: |
          pm2 delete cert-vault 2>$null
          pm2 start apis.js --name cert-vault
          pm2 save

      - name: Verify
        shell: powershell
        run: |
          pm2 status
